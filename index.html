<!DOCTYPE html>
<html lang="el">
<head>
    <!-- Ορισμός χαρακτήρων και responsive προσαρμογής -->
    <!-- Define character set and responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Τίτλος εφαρμογής -->
    <!-- Application title -->
    <title>HowToApp - Οδηγός Βημάτων & Συμβουλών</title>
    
    <!-- Σύνδεση με το εξωτερικό stylesheet -->
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>

    <!-- Κεντρικό περιτύπωμα εφαρμογής -->
    <!-- Main application container -->
    <div class="app-container">
        
        <!-- Επικεφαλίδα εφαρμογής -->
        <!-- Application header -->
        <header>
            <h1>HowToApp</h1>
            <p data-i18n="appDescription">Διαχειριστείτε τα βήματα και τις συμβουλές σας εύκολα και τοπικά</p>
            <div class="language-control">
                <label for="language-select" data-i18n="languageLabel">Γλώσσα / Language:</label>
                <select id="language-select">
                    <option value="el">Ελληνικά</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>
        <p id="status-message" class="status-message" role="status" aria-live="polite" aria-atomic="true" hidden>
            <span id="status-text"></span>
            <button type="button" id="undo-delete" class="undo-button" data-i18n="undo" hidden>Αναίρεση</button>
        </p>

        <!-- Κύριος κορμός με φόρμα και λίστα προβολής -->
        <!-- Main body with form and view list -->
        <main class="grid-layout">
            
            <!-- Στήλη φόρμας καταχώρισης -->
            <!-- Form column for entries -->
            <section class="card form-section" aria-labelledby="form-heading">
                <h2 id="form-heading" data-i18n="formTitle">Προσθήκη Νέου Βήματος</h2>
                
                <form id="step-form">
                    <!-- Επιλογή κατηγορίας -->
                    <!-- Category selection -->
                    <div class="form-group">
                        <label for="category" data-i18n="categoryLabel">Κατηγορία:</label>
                        <input type="text" id="category" required placeholder="π.χ. Προγραμματισμός" data-i18n-placeholder="categoryPlaceholder">
                    </div>

                    <div id="presentation-modal" class="presentation-modal" role="dialog" aria-modal="true" aria-labelledby="presentation-title" hidden>
                        <button type="button" id="presentation-close" class="presentation-close" aria-label="Κλείσιμο παρουσίασης">&times;</button>
                        <div class="presentation-progress" id="presentation-progress"></div>
                        <article class="presentation-slide">
                            <span id="presentation-category" class="presentation-category"></span>
                            <h2 id="presentation-title"></h2>
                            <div id="presentation-description" class="markdown-content"></div>
                            <img id="presentation-image" alt="" hidden>
                        </article>
                        <div class="presentation-controls">
                            <button type="button" id="presentation-prev" class="btn-secondary" data-i18n="previous">Προηγούμενο</button>
                            <button type="button" id="presentation-next" class="btn-primary" data-i18n="next">Επόμενο</button>
                        </div>
                    </div>

                    <!-- Επιλογή υποκατηγορίας -->
                    <!-- Subcategory selection -->
                    <div class="form-group">
                        <label for="subcategory" data-i18n="subcategoryLabel">Υποκατηγορία:</label>
                        <input type="text" id="subcategory" placeholder="π.χ. Git" data-i18n-placeholder="subcategoryPlaceholder">
                    </div>

                    <div class="form-group">
                        <label for="tags" data-i18n="tagsLabel">Ετικέτες:</label>
                        <input type="text" id="tags" placeholder="π.χ. δουλειά, επείγον" data-i18n-placeholder="tagsPlaceholder">
                    </div>

                    <div class="form-group">
                        <label for="due-date" data-i18n="dueDateLabel">Ημερομηνία ολοκλήρωσης:</label>
                        <input type="date" id="due-date">
                    </div>

                    <!-- Τίτλος βήματος/συμβουλής -->
                    <!-- Step/Tip title -->
                    <div class="form-group">
                        <label for="title" data-i18n="titleLabel">Τίτλος βήματος:</label>
                        <input type="text" id="title" required placeholder="π.χ. Αρχικοποίηση αποθετηρίου" data-i18n-placeholder="titlePlaceholder">
                    </div>

                    <!-- Σειρά εκτέλεσης -->
                    <!-- Execution order -->
                    <div class="form-group">
                        <label for="step-order" data-i18n="orderLabel">Σειρά εκτέλεσης:</label>
                        <input type="number" id="step-order" min="1" value="1" required>
                    </div>

                    <!-- Περιγραφή / Οδηγίες -->
                    <!-- Description / Instructions -->
                    <div class="form-group">
                        <label for="description" data-i18n="descriptionLabel">Περιγραφή και οδηγίες:</label>
                        <textarea id="description" rows="4" required placeholder="Αναλυτική περιγραφή..." data-i18n-placeholder="descriptionPlaceholder"></textarea>
                    </div>

                    <!-- Προαιρετική εικόνα -->
                    <!-- Optional image -->
                    <div class="form-group">
                        <label for="step-image" data-i18n="imageLabel">Προαιρετική εικόνα:</label>
                        <input type="file" id="step-image" accept="image/png,image/jpeg,image/webp">
                    </div>

                    <!-- Κουμπί υποβολής -->
                    <!-- Submit button -->
                    <button type="submit" class="btn-primary" data-i18n="saveStep">Αποθήκευση βήματος</button>
                    <button type="button" id="duplicate-step" class="btn-secondary" data-i18n="createDuplicate" hidden>Νέο βήμα με αυτά τα δεδομένα</button>
                    <button type="button" id="cancel-edit" class="btn-secondary" data-i18n="cancel" hidden>Ακύρωση</button>
                </form>
            </section>

            <!-- Στήλη προβολής καταχωρίσεων -->
            <!-- Display column for entries -->
            <section class="card display-section" aria-labelledby="list-heading">
                <h2 id="list-heading" data-i18n="listTitle">Λίστα βημάτων και συμβουλών</h2>
                
                <!-- Περιοχή φίλτρων αναζήτησης -->
                <!-- Search filter area -->
                <div class="filter-group">
                    <label class="sr-only" for="search-input" data-i18n="searchLabel">Αναζήτηση βημάτων</label>
                    <input type="search" id="search-input" placeholder="Αναζήτηση βημάτων..." data-i18n-placeholder="searchPlaceholder">
                    <select id="status-filter" data-i18n-aria-label="statusFilterLabel">
                        <option value="" data-i18n="allStatuses">Όλες οι καταστάσεις</option>
                        <option value="pending" data-i18n="pendingStatus">Σε εκκρεμότητα</option>
                        <option value="completed" data-i18n="completedStatus">Ολοκληρωμένα</option>
                        <option value="today" data-i18n="todayStatus">Για σήμερα</option>
                    </select>
                    <input type="text" id="tag-filter" list="tag-options" placeholder="Ετικέτα..." data-i18n-placeholder="tagFilterPlaceholder">
                    <datalist id="tag-options"></datalist>
                    <label class="sr-only" for="date-filter" data-i18n="dateFilterLabel">Φίλτρο ημερομηνίας ολοκλήρωσης</label>
                    <input type="date" id="date-filter" data-i18n-aria-label="dateFilterLabel">
                    <select id="category-filter" data-i18n-aria-label="categoryFilterLabel">
                        <option value="" data-i18n="allCategories">Όλες οι κατηγορίες</option>
                    </select>
                    <select id="subcategory-filter" data-i18n-aria-label="subcategoryFilterLabel" disabled>
                        <option value="" data-i18n="allSubcategories">Όλες οι υποκατηγορίες</option>
                    </select>
                    <select id="sort-select" data-i18n-aria-label="sortLabel">
                        <option value="category" data-i18n="sortCategory">Κατηγορία και σειρά</option>
                        <option value="step" data-i18n="sortStep">Σειρά βημάτων</option>
                        <option value="title" data-i18n="sortTitle">Τίτλος</option>
                        <option value="recent" data-i18n="sortRecent">Νεότερα πρώτα</option>
                    </select>
                </div>
                <div class="data-actions">
                    <section class="data-action-group" aria-labelledby="data-actions-title">
                        <h3 id="data-actions-title" data-i18n="dataActionsTitle">Ενέργειες βημάτων</h3>
                        <div class="data-action-buttons">
                            <button type="button" id="export-steps" class="btn-secondary" data-i18n="exportBackup">Εξαγωγή αντιγράφου</button>
                            <button type="button" id="delete-all-steps" class="btn-danger" data-i18n="deleteAllSteps">Διαγραφή όλων των βημάτων</button>
                            <button type="button" id="present-steps" class="btn-primary compact-button" data-i18n="presentSteps">Παρουσίαση</button>
                        </div>
                    </section>
                    <section class="data-action-group" aria-labelledby="import-files-title">
                        <h3 id="import-files-title" data-i18n="importFilesTitle">Εισαγωγή αρχείων</h3>
                        <div class="import-file-controls">
                            <div class="import-file-control">
                                <label for="import-file" data-i18n="importBackup">Εισαγωγή αντιγράφου:</label>
                                <input type="file" id="import-file" accept="application/json,.json">
                            </div>
                            <div class="import-file-control">
                                <label for="import-md-file" data-i18n="importMarkdown">Εισαγωγή Markdown:</label>
                                <input type="file" id="import-md-file" accept="text/markdown,.md,text/plain,.txt">
                            </div>
                            <div class="import-mode-control">
                                <label for="import-mode" data-i18n="importModeLabel">Συμπεριφορά εισαγωγής</label>
                                <select id="import-mode" aria-label="Συμπεριφορά εισαγωγής" data-i18n-aria-label="importModeLabel">
                                    <option value="replace" data-i18n="replaceAll">Αντικατάσταση όλων</option>
                                    <option value="merge" data-i18n="merge">Συγχώνευση</option>
                                </select>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Δυναμική λίστα βημάτων -->
                <!-- Dynamic steps list container -->
                <div id="steps-container" class="steps-list" role="region" data-i18n-aria-label="stepListLabel">
                    <!-- Τα στοιχεία θα φορτώνονται δυναμικά μέσω JavaScript -->
                    <!-- Items will be loaded dynamically via JavaScript -->
                </div>
            </section>

        </main>
    </div>

    <div id="markdown-import-modal" class="markdown-import-modal" role="dialog" aria-modal="true" aria-labelledby="markdown-import-title" hidden>
        <form id="markdown-import-form" class="markdown-import-panel">
            <h2 id="markdown-import-title" data-i18n="markdownImportTitle">Εισαγωγή αρχείου Markdown</h2>
            <p id="markdown-import-summary"></p>
            <div class="form-group">
                <label for="markdown-category" data-i18n="categoryLabel">Κατηγορία:</label>
                <input type="text" id="markdown-category" required>
            </div>
            <div class="form-group">
                <label for="markdown-subcategory" data-i18n="subcategoryLabel">Υποκατηγορία:</label>
                <input type="text" id="markdown-subcategory">
            </div>
            <div class="form-group">
                <label for="markdown-tags" data-i18n="tagsLabel">Ετικέτες:</label>
                <input type="text" id="markdown-tags" placeholder="π.χ. δουλειά, επείγον" data-i18n-placeholder="tagsPlaceholder">
            </div>
            <div class="form-group">
                <label for="markdown-due-date" data-i18n="dueDateLabel">Ημερομηνία ολοκλήρωσης:</label>
                <input type="date" id="markdown-due-date">
            </div>
            <div class="markdown-import-actions">
                <button type="button" id="markdown-import-cancel" class="btn-secondary" data-i18n="cancel">Ακύρωση</button>
                <button type="submit" class="btn-primary" data-i18n="importMarkdownSteps">Εισαγωγή βημάτων</button>
            </div>
        </form>
    </div>

    <!-- Σύνδεση με τα αρχεία JavaScript -->
    <!-- Link to JavaScript files -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
